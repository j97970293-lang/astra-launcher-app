plugins { id 'com.android.application' }

android {
    namespace 'com.astraforge.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.astraforge.launcher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // keystore.properties n'est pas versionné : sans lui, le release est
        // signé avec la clé de debug et reste installable, mais non publiable.
        release {
            initWith signingConfigs.debug
            // v3 : rotation de clé sur Android 9+ ; v1+v2 couvrent les anciens.
            enableV3Signing true
            def keystoreProps = rootProject.file('keystore.properties')
            if (keystoreProps.exists()) {
                def props = new Properties()
                keystoreProps.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}
