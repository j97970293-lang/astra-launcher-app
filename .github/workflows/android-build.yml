name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pas d'`android-actions/setup-android` : l'action exécute
      # `sdkmanager tools`, paquet supprimé du dépôt SDK, et échoue depuis.
      # Les images ubuntu-latest ont déjà le SDK ; on accepte les licences au
      # mieux, et Gradle télécharge lui-même platform 35 et build-tools 35.
      - name: Accepter les licences du SDK
        run: |
          SM=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then yes | "$SM" --licenses > /dev/null || true; fi

      - uses: gradle/actions/setup-gradle@v4

      # Le wrapper fixe la version de Gradle : la CI compile comme en local.
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: astra-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: astra-launcher-release
          path: app/build/outputs/apk/release/app-release.apk
